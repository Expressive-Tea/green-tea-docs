name: CI

# Build gate. Runs on both forges (the .github path is read by Gitea and GitHub alike).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      # Only a critical advisory blocks, as in release.yml. What ships is built HTML, CSS and JS;
      # Astro and Starlight are build-time tools that never reach a visitor, and an advisory with
      # no published fix would otherwise block every PR. The full report still prints.
      - run: npm audit --audit-level=critical
      - run: npm audit
        continue-on-error: true
      - run: npm run build
